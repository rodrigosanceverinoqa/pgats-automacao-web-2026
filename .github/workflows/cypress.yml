name: Testes Cypress

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cypress:
    name: Executar testes E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Obter codigo do repositorio
        uses: actions/checkout@v7

      - name: Instalar dependencias e executar Cypress
        uses: cypress-io/github-action@v7
        with:
          install-command: npm ci
          browser: chrome
          spec: cypress/e2e/1-getting-started/automation-trabalhoFinal.cy.js

      - name: Salvar relatorios e evidencias
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-cypress
          path: |
            cypress/reports/
            cypress/screenshots/
            cypress/videos/
          if-no-files-found: warn
          retention-days: 14
